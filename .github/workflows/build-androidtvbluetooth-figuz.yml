name: Build Figuz AndroidTV Bluetooth Controller

on:
  push:
    branches:
      - androidtvbluetooth-figuz
    paths:
      - .github/workflows/build-androidtvbluetooth-figuz.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hosting branch
        uses: actions/checkout@v4
        with:
          ref: androidtvbluetooth-figuz

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Clone upstream app
        run: |
          rm -rf /tmp/AndroidTVBluetooth
          git clone --depth 1 https://github.com/saihgupr/AndroidTVBluetooth.git /tmp/AndroidTVBluetooth
          rm -f /tmp/AndroidTVBluetooth/local.properties

      - name: Apply Figuz customisation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("/tmp/AndroidTVBluetooth")
          main = root / "app/src/main/java/com/saihgupr/btcontrol/MainActivity.java"
          s = main.read_text()

          anchor = "                List<BluetoothDevice> deviceList = new ArrayList<>(pairedDevices);\n"
          patch = (
              anchor
              + "\n"
              + "                // Figuz customisation: keep the Google TV remote paired, but hide it from this UI.\n"
              + "                deviceList.removeIf(device -> \"C4:19:D1:5A:16:E8\".equalsIgnoreCase(device.getAddress()));\n"
          )
          if anchor not in s:
              raise SystemExit("MainActivity patch anchor not found; upstream changed.")
          s = s.replace(anchor, patch, 1)
          main.write_text(s)

          gradle = root / "app/build.gradle"
          g = gradle.read_text()
          old = 'applicationId "com.saihgupr.btcontrol"'
          new = 'applicationId "com.figuz89.btcontrol"'
          if old not in g:
              raise SystemExit("applicationId patch anchor not found; upstream changed.")
          gradle.write_text(g.replace(old, new, 1))

          strings = root / "app/src/main/res/values/strings.xml"
          x = strings.read_text()
          x = x.replace(
              "<string name=\"app_name\">AndroidTVBluetooth</string>",
              "<string name=\"app_name\">AndroidTVBluetooth Figuz</string>",
              1,
          )
          x = x.replace(
              "<string name=\"app_title\">AndroidTV Bluetooth Controller</string>",
              "<string name=\"app_title\">AndroidTV Bluetooth Controller · Figuz</string>",
              1,
          )
          strings.write_text(x)
          PY

      - name: Build debug APK
        working-directory: /tmp/AndroidTVBluetooth
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publish APK to this branch
        run: |
          mkdir -p downloads
          cp /tmp/AndroidTVBluetooth/app/build/outputs/apk/debug/AndroidTVBluetooth.apk downloads/AndroidTVBluetooth-Figuz.apk
          cp /tmp/AndroidTVBluetooth/LICENSE downloads/AndroidTVBluetooth-Figuz-LICENSE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AndroidTVBluetooth-Figuz.apk downloads/AndroidTVBluetooth-Figuz-LICENSE.txt
          git commit -m "Build custom AndroidTV Bluetooth Controller" || exit 0
          git push origin androidtvbluetooth-figuz
